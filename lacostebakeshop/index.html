<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7971e" />
    <meta name="description" content="Lacoste Bakery – elegant French bakery with artisan pastries, breads, and French flag accents." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Lacoste Bakery | French Patisserie</title>
    <style>
        :root {
            color-scheme: light;
            font-family: 'Inter', sans-serif;
            background: #fff8f0;
            color: #2b2621;
            --brand: #f7971e;
            --brand-dark: #d96f0d;
            --flag-blue: #002395;
            --flag-red: #ed2939;
            --surface: #fff;
            --surface-muted: #fff3e6;
            --border: rgba(43, 38, 33, .12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top left, rgba(247, 151, 30, .16) 0%, transparent 36%), radial-gradient(circle at bottom right, rgba(0, 35, 149, .08) 0%, transparent 32%), #fff8f0;
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(14px);
            background: rgba(255, 248, 240, .92);
            border-bottom: 1px solid rgba(43, 38, 33, .08);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 20px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .75rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #2b2621;
        }

        .brand span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--flag-blue) 33%, #fff 33%, #fff 66%, var(--flag-red) 66%);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, .06);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .nav-link {
            color: #2b2621;
            font-size: .95rem;
            padding: .5rem .75rem;
            border-radius: 999px;
            transition: background .2s ease;
        }

        .nav-link:hover {
            background: rgba(247, 151, 30, .12);
        }

        .button-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            background: var(--brand);
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: .95rem 1.3rem;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .button-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(247, 151, 30, .2);
        }

        .hero {
            display: grid;
            grid-template-columns: 1.2fr .8fr;
            gap: 2rem;
            align-items: center;
            min-height: calc(100vh - 98px);
            padding: 64px 0 120px;
        }

        .hero-copy h1 {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3.5rem, 4.5vw, 5.5rem);
            line-height: .95;
            letter-spacing: -0.04em;
            color: #2b2621;
        }

        .hero-copy p {
            max-width: 610px;
            margin: 1.5rem 0 2rem;
            font-size: 1.05rem;
            line-height: 1.8;
            color: #564b44;
        }

        .hero-copy .badges {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .hero-copy .badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .75rem;
            padding: 1rem 1.1rem;
            border-radius: 18px;
            background: #fff;
            border: 1px solid rgba(43, 38, 33, .08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .04);
        }

        .hero-visual {
            position: relative;
            min-height: 420px;
            border-radius: 36px;
            background: linear-gradient(135deg, rgba(247, 151, 30, .16), rgba(237, 41, 57, .08) 38%, rgba(0, 35, 149, .1) 72%);
            overflow: hidden;
        }

        .hero-visual::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, .94), transparent 24%), radial-gradient(circle at 80% 30%, rgba(255, 255, 255, .4), transparent 16%), radial-gradient(circle at 50% 70%, rgba(0, 35, 149, .14), transparent 26%);
        }

        .hero-visual .panel {
            position: absolute;
            inset: 24px;
            border-radius: 30px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(255, 255, 255, .74);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(43, 38, 33, .08);
        }

        .hero-visual .panel h2 {
            margin: 0 0 .5rem;
            font-size: 1.35rem;
            color: #2b2621;
        }

        .hero-visual .panel p {
            margin: 0;
            color: #4c423a;
            line-height: 1.7;
        }

        section {
            padding: 84px 0;
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .section-heading::before {
            content: "";
            width: 44px;
            height: 4px;
            background: var(--brand);
            border-radius: 999px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: #fff;
            border-radius: 28px;
            padding: 1.8rem;
            border: 1px solid rgba(43, 38, 33, .08);
            box-shadow: 0 24px 50px rgba(0, 0, 0, .06);
        }

        .menu-item {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .menu-item strong {
            display: block;
            margin-bottom: .45rem;
            font-size: 1.05rem;
        }

        .menu-item .price {
            margin-left: auto;
            font-weight: 700;
            color: var(--brand-dark);
        }

        .menu-item p {
            margin: 0;
            color: #645a52;
            line-height: 1.8;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: 2fr 1.2fr;
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            min-height: 260px;
            border-radius: 34px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(247, 151, 30, .18), rgba(237, 41, 57, .12));
        }

        .gallery-item:nth-child(2) {
            min-height: 380px;
            background: linear-gradient(135deg, rgba(0, 35, 149, .14), rgba(247, 151, 30, .15));
        }

        .gallery-layer {
            position: absolute;
            inset: 0;
            opacity: .9;
            background: radial-gradient(circle at top left, rgba(255, 255, 255, .9), transparent 32%);
        }

        .gallery-caption {
            position: absolute;
            bottom: 1.3rem;
            left: 1.3rem;
            z-index: 1;
            color: #2b2621;
            font-weight: 700;
            font-size: 1.05rem;
        }

        .quote {
            max-width: 720px;
            margin-top: 1rem;
            font-size: 1.03rem;
            line-height: 1.9;
            color: #4c423a;
        }

        .location-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        .map-box {
            min-height: 360px;
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(0, 35, 149, .12), rgba(237, 41, 57, .1));
            border: 1px solid rgba(43, 38, 33, .08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .9);
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
            padding: 1.5rem;
            text-align: center;
        }

        .location-info {
            display: grid;
            gap: 1rem;
        }

        .location-list {
            display: grid;
            gap: .75rem;
            padding: 1.4rem 1.5rem;
            background: #fff;
            border-radius: 24px;
            border: 1px solid rgba(43, 38, 33, .08);
        }

        .location-list p {
            margin: 0;
            line-height: 1.8;
            color: #4c423a;
        }

        .footer {
            padding: 2rem 0 4rem;
        }

        .footer-inner {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 1.5rem;
            color: #4c423a;
        }

        .footer a {
            color: var(--brand-dark);
        }

        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .35);
            z-index: 30;
            display: flex;
            justify-content: flex-end;
        }

        .drawer {
            width: min(420px, 100%);
            max-width: 420px;
            height: 100%;
            background: #fff;
            box-shadow: -30px 0 70px rgba(0, 0, 0, .16);
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        .drawer h3 {
            margin: 0 0 1rem;
        }

        .drawer .drawer-close {
            margin-left: auto;
            border: none;
            background: none;
            font-size: 1rem;
            cursor: pointer;
            color: #62594f;
        }

        .cart-list {
            flex: 1;
            display: grid;
            gap: 1rem;
            overflow: auto;
            padding-right: 1px;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            padding: 1rem;
            border-radius: 22px;
            background: #fff7ee;
            border: 1px solid rgba(247, 151, 30, .18);
        }

        .cart-item strong {
            display: block;
        }

        .cart-item small {
            color: #6a6058;
        }

        .cart-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .cart-actions button {
            width: 100%;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            background: #2b2621;
            color: #fff;
            padding: 1rem 1.3rem;
            border-radius: 999px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .2);
            z-index: 40;
        }

        @media (max-width: 960px) {
            .hero {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .hero-visual {
                min-height: 320px;
            }

            .grid-3 {
                grid-template-columns: 1fr;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .location-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 680px) {
            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            nav {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .hero-copy .badges {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
        const { createElement: h, useState, useMemo, useContext, createContext } = React;
        const CartContext = createContext();

        function CartProvider({ children }) {
            const [items, setItems] = useState([]);
            const total = useMemo(() => items.reduce((sum, item) => sum + item.price * item.quantity, 0), [items]);

            const addItem = (product) => {
                setItems((current) => {
                    const existing = current.find((item) => item.id === product.id);
                    if (existing) {
                        return current.map((item) => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...current, { ...product, quantity: 1 }];
                });
            };

            const removeItem = (id) => setItems((current) => current.filter((item) => item.id !== id));
            const clearCart = () => setItems([]);

            return h(CartContext.Provider, { value: { items, addItem, removeItem, clearCart, total } }, children);
        }

        const products = [
            { id: 'canele', name: 'Canelé Bordelais', price: 8, description: 'Caramelized shell, custardy center, orange blossom nuance.' },
            { id: 'tartelette', name: 'Tartelette à l’Orange', price: 9, description: 'Delicate citrus custard on a crisp butter crust.' },
            { id: 'macaron', name: 'Macaron Trio', price: 14, description: 'Three seasonal flavors with a crisp shell and velvet ganache.' },
            { id: 'kouign', name: 'Kouign-Amann', price: 11, description: 'Golden layers of butter and sugar, pure Breton indulgence.' }
        ];

        function Header({ onToggleCart }) {
            return h('header', null,
                h('div', { className: 'page header-inner' },
                    h('div', { className: 'brand' },
                        h('span'),
                        h('div', null, 'Lacoste Bakery')
                    ),
                    h('nav', null,
                        ['Menu', 'Gallery', 'Location', 'About'].map((section) =>
                            h('a', { key: section, className: 'nav-link', href: `#${section.toLowerCase()}` }, section)
                        ),
                        h('button', { className: 'button-primary', type: 'button', onClick: onToggleCart }, 'View Cart')
                    )
                )
            );
        }

        function Hero({ onAdd }) {
            return h('section', { className: 'page hero', id: 'home' },
                h('div', { className: 'hero-copy' },
                    h('p', { style: { color: '#ed2939', fontWeight: 700, letterSpacing: '.23em', textTransform: 'uppercase', marginBottom: '1rem' } }, 'French patisserie'),
                    h('h1', null, 'Lacoste Bakery: modern Parisian bakery pastries baked fresh daily'),
                    h('p', null, 'A serene bakery experience inspired by the elegance of French cafés, accented in blue, white and red. Discover refined pastries, artisan breads, and a cart ready for seamless ordering.'),
                    h('div', { className: 'hero-copy badges' },
                        h('div', { className: 'badge' }, h('span'), h('div', null, 'Orange primary')),
                        h('div', { className: 'badge' }, h('span'), h('div', null, 'French flag accents'))
                    ),
                    h('button', { className: 'button-primary', type: 'button', onClick: () => onAdd(products[0]) }, 'Add Canelé')
                ),
                h('div', { className: 'hero-visual' },
                    h('div', { className: 'panel' },
                        h('div', null,
                            h('h2', null, 'Artisan elegance'),
                            h('p', null, 'Soft abstract layers, refined details, and a warm color palette set the scene before the first bite.')
                        ),
                        h('div', null,
                            h('p', { style: { margin: 0, fontWeight: 700, color: '#2b2621' } }, 'Open daily • 9am — 7pm')
                        )
                    )
                )
            );
        }

        function MenuCard({ product, onAdd }) {
            return h('div', { className: 'card' },
                h('div', { className: 'menu-item' },
                    h('div', null,
                        h('strong', null, product.name),
                        h('p', null, product.description)
                    ),
                    h('div', { className: 'price' }, `$${product.price}`)
                ),
                h('button', { className: 'button-primary', type: 'button', style: { marginTop: '1.5rem' }, onClick: () => onAdd(product) }, 'Add to cart')
            );
        }

        function Menu({ onAdd }) {
            return h('section', { className: 'page', id: 'menu' },
                h('div', { className: 'section-heading' }, h('h2', null, 'Menu')),
                h('div', { className: 'grid-3' }, products.map((product) => h(MenuCard, { key: product.id, product, onAdd })))
            );
        }

        function Gallery() {
            return h('section', { className: 'page', id: 'gallery' },
                h('div', { className: 'section-heading' }, h('h2', null, 'Gallery')),
                h('div', { className: 'gallery-grid' },
                    h('div', { className: 'gallery-item' },
                        h('div', { className: 'gallery-layer' }),
                        h('div', { className: 'gallery-caption' }, 'Abstract pastry landscapes')
                    ),
                    h('div', { className: 'gallery-item' },
                        h('div', { className: 'gallery-layer' }),
                        h('div', { className: 'gallery-caption' }, 'Soft tones inspired by French design')
                    ),
                    h('div', { className: 'gallery-item' },
                        h('div', { className: 'gallery-layer' }),
                        h('div', { className: 'gallery-caption' }, 'Orange light and serene geometry')
                    )
                ),
                h('p', { className: 'quote' }, 'No stock food photography. Each visual is an abstract vignette, designed to embody the essence of modern French patisserie.')
            );
        }

        function Location() {
            return h('section', { className: 'page', id: 'location' },
                h('div', { className: 'section-heading' }, h('h2', null, 'Location')),
                h('div', { className: 'location-grid' },
                    h('div', { className: 'map-box' }, 'Île-de-France inspired atmosphere'),
                    h('div', { className: 'location-info' },
                        h('div', { className: 'location-list' },
                            h('p', null, 'Lacoste Bakery'),
                            h('p', null, '21 Rue des Tuileries'),
                            h('p', null, 'Paris, FR 75001'),
                            h('p', null, 'Open Monday to Sunday'),
                            h('p', null, 'Call: +33 1 23 45 67 89')
                        )
                    )
                )
            );
        }

        function About() {
            return h('section', { className: 'page', id: 'about' },
                h('div', { className: 'section-heading' }, h('h2', null, 'About Lacoste Bakery')),
                h('div', { className: 'card' },
                    h('p', null, 'Lacoste Bakery celebrates the polished minimalism of French bakery houses with a calming palette and an inviting sense of warmth. The site is built as a single-page experience with a refined cart drawer, elegant navigation, and abstract visuals that evoke a modern patisserie and fresh-baked goods.')
                )
            );
        }

        function Footer() {
            return h('footer', { className: 'page footer' },
                h('div', { className: 'footer-inner' },
                    h('div', null,
                        h('p', { style: { margin: 0, fontWeight: 700 } }, 'Lacoste Bakery'),
                        h('p', null, 'Built for quiet luxury and effortless ordering.')
                    ),
                    h('div', null,
                        h('p', { style: { margin: 0 } }, 'Follow us'),
                        h('a', { href: '#', style: { display: 'inline-block', marginTop: '0.5rem' } }, 'Instagram')
                    )
                )
            );
        }

        function CartDrawer({ isOpen, onClose }) {
            const { items, total, removeItem, clearCart } = useContext(CartContext);
            const [status, setStatus] = useState(null);

            const submitOrder = () => {
                if (!items.length) return;
                setStatus('Sending order…');
                fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items }),
                })
                    .then((response) => {
                        if (!response.ok) throw new Error('Order failed');
                        return response.json();
                    })
                    .then(() => {
                        setStatus('Order received. Merci !');
                        clearCart();
                    })
                    .catch(() => setStatus('Unable to submit order. Please try again later.'));
            };

            if (!isOpen) return null;
            return h('div', { className: 'drawer-backdrop', onClick: onClose },
                h('div', { className: 'drawer', onClick: (event) => event.stopPropagation() },
                    h('div', { style: { display: 'flex', alignItems: 'center', gap: '1rem' } },
                        h('h3', null, 'Cart'),
                        h('button', { type: 'button', className: 'drawer-close', onClick: onClose }, 'Close')
                    ),
                    items.length === 0
                        ? h('p', null, 'Your cart is empty. Add a pastry to begin.')
                        : h('div', { className: 'cart-list' }, items.map((item) =>
                            h('div', { key: item.id, className: 'cart-item' },
                                h('div', null,
                                    h('strong', null, item.name),
                                    h('small', null, `${item.quantity} x $${item.price.toFixed(2)}`)
                                ),
                                h('button', { type: 'button', className: 'drawer-close', onClick: () => removeItem(item.id) }, 'Remove')
                            )
                        )),
                    h('div', { className: 'cart-actions' },
                        h('span', { style: { fontWeight: 700, fontSize: '1rem' } }, `Total $${total.toFixed(2)}`),
                        h('button', { className: 'button-primary', type: 'button', onClick: submitOrder, disabled: items.length === 0 }, 'Place Order')
                    ),
                    status && h('div', { className: 'toast' }, status)
                )
            );
        }

        function App() {
            const [open, setOpen] = useState(false);
            const { addItem } = useContext(CartContext);
            return h('div', null,
                h(Header, { onToggleCart: () => setOpen(true) }),
                h('main', null,
                    h(Hero, { onAdd: addItem }),
                    h(Menu, { onAdd: addItem }),
                    h(Gallery),
                    h(Location),
                    h(About)
                ),
                h(Footer),
                h(CartDrawer, { isOpen: open, onClose: () => setOpen(false) })
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            h(CartProvider, null, h(App, null))
        );
    </script>
</body>
</html>
